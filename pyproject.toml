[project]
name = "spark-delta-lakehouse"
version = "0.1.0"
description = "Dimensional modelling on Spark and Delta Lake, retail banking domain"
requires-python = ">=3.10"
# The spec loader reads YAML. PySpark is supplied by the Spark image, not here:
# pinning it locally would invite a version that disagrees with the cluster.
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declared so `uv sync` installs the package. Without it, imports only work
# when the caller sets PYTHONPATH, which three different places were doing
# three different ways.
[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.ruff]
line-length = 100
extend-exclude = ["warehouse"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
