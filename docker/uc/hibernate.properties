# UC 0.5.0 ships an H2 file database by default, which is fine for a laptop and
# wrong for anything shared: single process, no concurrent access, and the
# "database" is a file in the container. The Postgres JDBC driver (42.7.2) is
# already on the server's classpath, so backing it with a real database is a
# config change rather than a rebuild. A bank would run Postgres; so do we.
hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://catalog-db:5432/unitycatalog
hibernate.connection.user=unitycatalog
hibernate.connection.password=unitycatalog
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.use_sql_comments=true
org.hibernate.SQL=INFO
