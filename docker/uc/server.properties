# Unity Catalog 0.5.0 server config.
#
# The important thing this file does NOT contain is an S3 endpoint. UC's S3
# config exposes bucketPath, region, awsRoleArn, accessKey, secretKey and
# sessionToken, and nothing else. Credential vending therefore assumes real
# AWS. Against MinIO the catalog can hold the metadata but cannot hand out
# working credentials for it, so tables are EXTERNAL and Spark authenticates
# to MinIO itself through fs.s3a.*. See ADR 0003.

server.env=dev

# Authorization off: this is a local demo, and turning it on requires a real
# identity provider (issuer, audiences, client id and secret). A bank would
# enable it; the point here is the catalog namespace, not the login flow.
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
server.client-secret=
server.redirect-port=
server.allowed-issuers=
server.audiences=
server.cookie-timeout=P5D

# Managed tables would require UC to write to storage on our behalf, which is
# exactly the vending path that does not work against MinIO. External tables
# keep the write path in Spark, where the endpoint is configurable.
server.managed-table.enabled=false

aws.masterRoleArn=
aws.accessKey=
aws.secretKey=
aws.region=

# Registered so UC recognises the location prefix when external tables are
# created against it. The credentials here are not used for vending; Spark
# supplies its own.
s3.bucketPath.0=s3://lakehouse
s3.region.0=us-east-1
s3.awsRoleArn.0=arn:aws:iam::000000000000:role/lakehouse-local
# Values must match docker/.env, the single credential source; these are
# inert for vending (see above) and exist only so UC accepts the bucket.
s3.accessKey.0=lakehouse
s3.secretKey.0=lakehouse123
s3.sessionToken.0=local-no-sts

adls.storageAccountName.0=
adls.tenantId.0=
adls.clientId.0=
adls.clientSecret.0=

gcs.bucketPath.0=
gcs.jsonKeyFilePath.0=
