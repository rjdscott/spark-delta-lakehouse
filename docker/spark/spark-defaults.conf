# Cluster-wide defaults, baked into the image so master, workers and driver
# agree. Anything environment-specific (the MinIO endpoint, the UC URI) is set
# here too, because this file is the seam: no transformation code in this repo
# knows the storage scheme or the catalog implementation.

# --- Delta ---
spark.sql.extensions                       io.delta.sql.DeltaSparkSessionExtension
# Delta needs the *session* catalog wrapped as well as the extension installed.
# Without this, any path-based Delta write fails with
# DELTA_CONFIGURE_SPARK_SESSION_WITH_EXTENSION_AND_CATALOG, even when the UC
# catalog is configured correctly: they are two different catalogs.
spark.sql.catalog.spark_catalog            org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- Unity Catalog ---
# UCSingleCatalog is the connector's entry point. The catalog name on the left
# of the dot in lakehouse.silver.party is whatever we call it here.
spark.sql.catalog.lakehouse                io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.lakehouse.uri            http://unitycatalog:8080
spark.sql.catalog.lakehouse.token

# The default catalog is the Spark session catalog, NOT lakehouse, because
# Unity Catalog cannot vend credentials for MinIO: every read through it calls
# generateTemporaryPathCredentials, which needs AWS STS. UC stays configured
# and populated so the namespace is real and the migration is a one-line
# change of this property. See ADR 0004.
spark.sql.defaultCatalog                   spark_catalog

# --- Hive Metastore: the catalog the pipeline runs on ---
# Spark ships a Hive 2.3.10 metastore client and talks to a 4.0.1 server. The
# thrift API is compatible for the operations used here; the smoke test proves
# it rather than the docs promising it. See ADR 0005.
spark.sql.catalogImplementation             hive
spark.hadoop.hive.metastore.uris            thrift://hive-metastore:9083
# Use the 4.0.1 client jars, not Spark's bundled 2.3.10 ones. Without this,
# any table operation fails with "Invalid method name: 'get_table'".
spark.sql.hive.metastore.version            4.0.1
spark.sql.hive.metastore.jars               path
spark.sql.hive.metastore.jars.path          file:///opt/hive-metastore-jars/*
# Managed tables land in object storage, not on a container's local disk.
spark.sql.warehouse.dir                     s3a://lakehouse/warehouse

# --- MinIO through the s3a connector ---
# Unity Catalog 0.5.0 has no endpoint field in server.properties, so it cannot
# vend credentials for a non-AWS S3. Spark authenticates to MinIO directly and
# UC stores only the table location. See ADR 0003.
spark.hadoop.fs.s3a.endpoint               http://minio:9000
spark.hadoop.fs.s3a.path.style.access      true
spark.hadoop.fs.s3a.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem
# Credentials are NOT configured in this file, and that is not an omission:
# Spark's SparkHadoopUtil copies AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from
# the container environment (set in compose from docker/.env) into
# fs.s3a.access.key/fs.s3a.secret.key at session build. SimpleAWSCredentials-
# Provider then reads those conf keys. Strip the env vars and every s3a call
# fails with NoAwsCredentialsException; review-06 verified both directions.
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Unity Catalog registers locations as s3://, Spark reads them with the s3a
# connector. Without this mapping every UC-registered table fails with
# "No FileSystem for scheme: s3".
spark.hadoop.fs.s3.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.endpoint                http://minio:9000
spark.hadoop.fs.s3.path.style.access       true

# Object stores have no atomic rename, so Delta commits route through the
# LogStore rather than a filesystem move. Documented safe for one driver JVM
# per table at a time; nothing enforces that against two concurrent
# spark-submits, so do not run overlapping writes to one table by hand.
spark.delta.logStore.s3a.impl              io.delta.storage.S3SingleDriverLogStore
# No fs.s3a.committer.* settings on purpose: Delta bypasses Hadoop output
# committers entirely through its own commit protocol, so committer config
# here is dead weight that reads as protection (review-06 M-11).

# --- Sizing for a workstation, not a bank ---
# Executors were OOM-killed at 2g building fact_daily_balance, which cross
# joins accounts with days. Spark recovered by re-running the stage, so the
# job succeeded while printing MetadataFetchFailedException stack traces, and
# a recovered failure is still a failure in front of an audience. Exit code
# 137 in the worker log is the tell: the process was killed, not the job.
spark.sql.shuffle.partitions               16
spark.driver.memory                        2g
spark.executor.memory                      4g
spark.executor.cores                       2
